[package]
name = "ocellus"
version = "0.1.0"
edition = "2024"
description = "A Rust hardware telemetry exporter for x86_64 Linux hosts."
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
prometheus-client = "0.24.1"
raw-cpuid = "11.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time", "io-util"] }
